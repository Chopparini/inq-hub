name: CI & Security Scan

permissions:
  contents: read
  pull-requests: write   # gitleaks komentuje znalezione sekrety w PR

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    name: vuln-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [secret-scan, vuln-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t inq-hub-frontend --build-arg VITE_API_BASE_URL=http://localhost:8000/api ./frontend
      - name: Build backend image
        run: docker build -t inq-hub-backend ./backend


  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: [secret-scan, vuln-scan]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      SECRET_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check app starts
        run: python -c "from app.main import app"
      - name: Run tests
        run: pytest -v

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    needs: [secret-scan, vuln-scan]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build