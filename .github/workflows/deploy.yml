name: CD – Deploy to Azure

on:
  workflow_call:

jobs:
  deploy-backend:
    name: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO – wdrożenie backendu"

  deploy-backend:
    name: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ghcr.io/chopparini/inq-hub-backend:${{ github.sha }}
      RESOURCE_GROUP: rg-wsb-projekt
      CONTAINER_APP: ca-inqhub-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App
        run: az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"

  healthcheck:
    name: healthcheck
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO – weryfikacja po wdrożeniu"
