name: CD – Deploy to Azure

on:
  workflow_call:

jobs:
  deploy-backend:
    name: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ghcr.io/chopparini/inq-hub-backend:${{ github.sha }}
      RESOURCE_GROUP: rg-wsb-projekt
      CONTAINER_APP: ca-inqhub-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build --build-arg GIT_SHA=${{ github.sha }} -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App
        run: az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"

  deploy-frontend:
    name: deploy-frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ghcr.io/chopparini/inq-hub-frontend:${{ github.sha }}
      RESOURCE_GROUP: rg-wsb-projekt
      CONTAINER_APP: ca-inqhub-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build --build-arg VITE_APP_VERSION=${{ github.sha }} -t "$IMAGE" frontend
          docker push "$IMAGE"

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App
        run: az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"

  healthcheck:
    name: healthcheck
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Backend health (przez frontend)
        run: |
          for i in $(seq 1 10); do
            curl -fsS "${{ vars.FRONTEND_URL }}/api/health" && exit 0
            echo "Próba $i nieudana, czekam 15 s"
            sleep 15
          done
          exit 1

      - name: Backend version
        run: |
          for i in $(seq 1 10); do
            v=$(curl -fsS "${{ vars.FRONTEND_URL }}/api/version" | python3 -c "import sys, json; print(json.load(sys.stdin)['version'])") || v=""
            echo "Wdrożona: $v, oczekiwana: ${{ github.sha }}"
            [ "$v" = "${{ github.sha }}" ] && exit 0
            sleep 15
          done
          exit 1

      - name: Frontend
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "${{ vars.FRONTEND_URL }}"
  e2e-tests:
    name: e2e-tests
    needs: healthcheck
    runs-on: ubuntu-latest
    environment: production
    env:
      LIVE_APP_URL: ${{ vars.FRONTEND_URL }}
      LIVE_USER: ${{ secrets.LIVE_USER }}
      LIVE_PASSWORD: ${{ secrets.LIVE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testy API
        working-directory: backend
        run: |
          pip install pytest httpx
          pytest tests/test_live_api.py -v --junitxml=test-results/api.xml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalacja Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Testy E2E (headless)
        working-directory: e2e
        run: npx playwright test

      - name: Raporty testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-testow
          path: |
            backend/test-results/
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14