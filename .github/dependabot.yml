version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    target-branch: development
    open-pull-requests-limit: 1
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    target-branch: development
    open-pull-requests-limit: 1
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: development
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]