name: CI & Security Scan

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # krok skanera sekretów

  vuln-scan:
