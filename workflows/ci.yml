name: CI & Security Scan

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # krok skanera sekretów

  vuln-scan:
    name: vuln-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: aquasecurity/trivy-action@0.76.2
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
        # krok Trivy
  
  # joby budowania: frontend-build, backend-test, docker-build
  # każdy z: needs: [secret-scan, vuln-scan]
